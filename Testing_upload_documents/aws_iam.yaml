
set_user_field: username #Options: username, strip_email, custom


password_mapping:
  first_name:
    count: 4
    capitalize_count: 1
  employee_id: full
  character: "@"
  number: 145

delete_type: soft_delete

policy_scope: "All" #policy_scope: 'All', 'AWS', or 'Local'


